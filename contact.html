<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - تحليل الصوت</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo-link">
                <div class="logo">
                    <img src="logo.png" alt="شعار تحليل الصوت" onerror="this.style.display='none'">
                    <h1>تحليل الصوت</h1>
                </div>
            </a>
        </nav>
    </header>

    <main class="main-content">
        <div class="page-container">
            <h2 class="page-title">تواصل معنا</h2>
            
            <div class="page-content">
                <p style="text-align: center; margin-bottom: 2rem; font-size: 1.2rem;">نحن هنا لمساعدتك! تواصل معنا لأي استفسار.</p>

                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label for="name">الاسم الكامل</label>
                        <input type="text" id="name" name="name" placeholder="أدخل اسمك الكامل" required>
                    </div>

                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">رقم الهاتف (اختياري)</label>
                        <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx">
                    </div>

                    <div class="form-group">
                        <label for="subject">الموضوع</label>
                        <select id="subject" name="subject" required>
                            <option value="">اختر الموضوع</option>
                            <option value="general">استفسار عام</option>
                            <option value="technical">مشكلة تقنية</option>
                            <option value="billing">استفسار عن الفواتير</option>
                            <option value="suggestion">اقتراح</option>
                            <option value="other">أخرى</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">الرسالة</label>
                        <textarea id="message" name="message" rows="6" placeholder="اكتب رسالتك هنا..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">إرسال الرسالة</button>
                </form>

                <div style="margin-top: 2rem; text-align: center;">
                    <p style="margin-top: 1rem;">
                        <strong>البريد الإلكتروني:</strong> <a href="mailto:rawaasoliman_2003@icloud.com" style="color: #e0b0ff; text-decoration: none; transition: all 0.3s ease;">rawaasoliman_2003@icloud.com</a><br>
                        <strong>الهاتف:</strong> <a href="https://wa.me/966590641507" target="_blank" style="color: #e0b0ff; text-decoration: none; transition: all 0.3s ease;">0590641507</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <nav class="footer-nav">
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="faq.html">الأسئلة الشائعة</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html" class="active">تواصل معنا</a></li>
                <li><a href="support.html">الدعم الفني</a></li>
                <li><a href="subscription.html">الاشتراك</a></li>
            </ul>
        </nav>
        <p>&copy; 2025 جميع الحقوق محفوظة لصالح مدارس الإحسان.</p>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('شكراً لك! تم إرسال رسالتك بنجاح. سنتواصل معك قريباً.');
            this.reset();
        });
    </script>
</body>
</html>
